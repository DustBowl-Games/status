# DustBowl Games System Status
# Production Configuration: https://status.dustbowl.games

owner: DustBowl-Games
repo: status

sites:
  - name: DustBowl.Games (Public Web)
    url: https://dustbowl.games
    icon: https://assets.dustbowl.games/cms/web-assets/favicon-32.png
  - name: Cloudflare Tunnel & Edge Gateway (db-rke2-lan)
    url: https://vaultwarden.dustbowl.games/alive
    icon: https://assets.dustbowl.games/cms/web-assets/favicon-32.png
  - name: Vaultwarden (Encrypted Password Vault)
    url: https://vaultwarden.dustbowl.games
    icon: https://vaultwarden.dustbowl.games/images/icon.png
  - name: Community Platform (Discourse)
    url: https://community.dustbowl.games
    icon: https://community.dustbowl.games/favicon.ico
  - name: Knowledgebase & Support Docs
    url: https://dustbowl.games/kb
    icon: https://assets.dustbowl.games/cms/web-assets/favicon-32.png

status-website:
  cname: status.dustbowl.games
  name: " "
  logoUrl: https://assets.dustbowl.games/cms/branding/logo-wordmark-dark.png
  favicon: https://assets.dustbowl.games/cms/web-assets/favicon-32.png
  theme: dark
  introTitle: "Operations & Fleet Status"
  introMessage: "Real-time health, latency telemetry, and incident reporting across DustBowl's bare-metal game infrastructure."
  navbar:
    - title: "Home"
      href: https://dustbowl.games
    - title: "Game Servers"
      href: https://dustbowl.games/game-servers
    - title: "Community"
      href: https://community.dustbowl.games
    - title: "Support"
      href: https://dustbowl.games/contact

notifications:
  - type: ntfy
    server: https://ntfy.dustbowl.games
    topic: dustbowl-alerts

workflowSchedule:
  graphs: "0 0 * * *"
  response_time: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * *"
  updates: "0 3 * * *"
  uptime: "*/5 * * * *"
