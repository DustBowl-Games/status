# Change these configuration options for your site
# Documentation: https://upptime.js.org/docs

owner: DustBowl-Games
repo: status

sites:
  - name: DustBowl Games Web
    url: https://dustbowl.games
    icon: https://dustbowl.games/favicon.ico
  - name: Vaultwarden
    url: https://vaultwarden.dustbowl.games
    icon: https://vaultwarden.dustbowl.games/images/icon.png
  - name: Community Discourse
    url: https://community.dustbowl.games
  - name: Status & Heartbeat
    url: https://status.dustbowl.games
  - name: Fleet & Game Servers
    url: https://dustbowl.games/servers

status-website:
  # CNAME for custom domain
  cname: status.dustbowl.games
  # Website branding
  name: DustBowl Games Status
  introTitle: "**DustBowl Games** Live System Health"
  introMessage: "Real-time service health, uptime history, and infrastructure incident response."
  navbar:
    - title: DustBowl.Games
      href: https://dustbowl.games
    - title: Community
      href: https://community.dustbowl.games
    - title: Password Vault
      href: https://vaultwarden.dustbowl.games

# Push notifications to self-hosted ntfy instance
notifications:
  - type: ntfy
    server: https://ntfy.dustbowl.games
    topic: dustbowl-alerts

# Workflow schedule (every 5 minutes)
workflowSchedule:
  graphs: "0 0 * * *"
  response_time: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * *"
  updates: "0 3 * * *"
  uptime: "*/5 * * * *"
