# This file is generated by Upptime (https://github.com/upptime/upptime)
# Do not edit this file directly!

name: Static Site CI
on:
  schedule:
    - cron: "0 1 * * *"
  repository_dispatch:
    types: [static_site]
  workflow_dispatch:
jobs:
  release:
    name: Build and Deploy Site
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Generate site
        uses: upptime/uptime-monitor@v1.46.5
        with:
          args: "site"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
      - name: Inject DustBowl Production Theme & Brand Assets
        run: |
          if [ -d "site/__sapper__/export" ]; then
            TARGET_DIR="site/__sapper__/export"
          elif [ -d "dist" ]; then
            TARGET_DIR="dist"
          else
            TARGET_DIR="."
          fi
          echo "Target build directory: $TARGET_DIR"
          
          # Overwrite theme CSS
          mkdir -p $TARGET_DIR/themes
          cat << 'EOF' > $TARGET_DIR/themes/dark.css
:root {
  --body-background-color: #080605;
  --body-text-color: #f8f3ee;
  --card-background-color: #15100d;
  --card-border-color: #35251d;
  --nav-background-color: #080605;
  --nav-border-bottom-color: #35251d;
  --nav-current-border-bottom-color: #ce5828;
  --up-border-left-color: #22c55e;
  --up-background-color: #22c55e;
  --tag-up-background-color: #22c55e;
  --down-border-left-color: #dc2626;
  --down-background-color: #450a0a;
  --tag-down-background-color: #dc2626;
  --degraded-border-left-color: #ce5828;
  --degraded-background-color: #ce5828;
  --tag-degraded-background-color: #ce5828;
  --tag-color: #ffffff;
  --change-background-color: #ce5828;
  --error-button-border-color: #ce5828;
  --error-button-background-color: #ce5828;
  --error-button-color: #f8f3ee;
  --submit-button-border-color: #ce5828;
  --submit-button-background-color: #ce5828;
  --submit-button-color: #f8f3ee;
  --graph-opacity: 0.95;
  --graph-filter: none;
}
EOF
          cp $TARGET_DIR/themes/dark.css $TARGET_DIR/themes/light.css
          
          # Inject exact font & styling into global.css
          cat << 'EOF' >> $TARGET_DIR/global.css
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Oxanium:wght@600;700;800&display=swap');
body { font-family: 'Manrope', sans-serif !important; background: #080605 !important; color: #f8f3ee !important; }
h1, h2, h3, h4, h5, h6, .tag { font-family: 'Oxanium', sans-serif !important; text-transform: uppercase !important; letter-spacing: 0.05em !important; }
article { background: #15100d !important; border: 1px solid #35251d !important; border-radius: 0.5rem !important; }
article.up { border-left: 5px solid #22c55e !important; }
article.down { border-left: 5px solid #dc2626 !important; }
nav { background: #080605 !important; border-bottom: 1px solid #35251d !important; }
EOF
      - uses: peaceiris/actions-gh-pages@v4
        with:
          clean_protected_files: true
          github_token: ${{ secrets.GH_PAT || github.token }}
          publish_dir: "site/__sapper__/export"
          user_name: "DustBowl-Ops"
          user_email: "ops@dustbowl.games"
